<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Caminante sobre un mar de nubes</title>
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; background: black; }
    a { color: orange; text-decoration: underline; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #controls {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: rgba(0,0,0,0.8); color: white; padding: 12px;
      font-family: sans-serif; 
      border-radius: 4px;
      max-width: 320px;
    }
    #dc-name { margin: 0 0 4px; }
    #dc-location { font-size: 0.95em; opacity: 0.9; }
    #dc-metrics {
      list-style: none; margin: 8px 0 0; padding: 0;
      font-size: 0.8em; opacity: 0.7;
    }
    #dc-metrics li { margin: 2px 0; }
    #dc-metrics li span { font-weight: bold; }
    #citation { margin-top: 16px; font-size: 0.65em; opacity: 0.6; }
    #wanderer {
      position: absolute; bottom: -11%; left: 50%; transform: translateX(-50%);
      height: 80vh; width: auto; z-index: 1; pointer-events: none;
    }
  </style>
</head>
<body>

<div id="controls">
  <h3 id="dc-name">Caminante sobre un mar de nubes</h3>
  <div id="dc-location"></div>
  <ul id="dc-metrics"></ul>
  <div id="citation">Source: Datacenter Atlas, <a href="https://www.datacenter-atlas.com">https://www.datacenter-atlas.com</a> (data version 26.08-c2, accessed 2026-10-25)</div>
</div>

<div id="map"></div>
<img id="wanderer" src="wanderer.png" alt="Wanderer" />

<script>
  // Data Center Coordinates, loaded from datacenter-atlas-sample-26.08-c2-sorted.csv
  let datacenters = [];
  let currentIndex = 0;
  let map;

  const DWELL_MS = 5000; // pause at each location before flying to the next

  // Parses CSV text into an array of row objects keyed by header name.
  // Handles quoted fields, embedded commas/newlines, and escaped quotes ("").
  function parseCSV(text) {
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];

      if (inQuotes) {
        if (char === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += char;
        }
      } else if (char === '"') {
        inQuotes = true;
      } else if (char === ',') {
        row.push(field);
        field = '';
      } else if (char === '\r') {
        // ignore, handled by \n
      } else if (char === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
      } else {
        field += char;
      }
    }
    if (field.length > 0 || row.length > 0) {
      row.push(field);
      rows.push(row);
    }

    const headers = rows.shift().map(h => h.trim());
    return rows
      .filter(r => r.length === headers.length)
      .map(r => Object.fromEntries(headers.map((h, i) => [h, r[i]])));
  }

  async function loadDataCenters() {
    const response = await fetch('datacenter-atlas_filtrado_medio.csv');
    const text = await response.text();
    const records = parseCSV(text);

    return records
      .map(r => ({
        name: r.name,
        city: r.city,
        country: r.country_name,
        itLoadMw: r.it_load_mw,
        dqs: r.dqs,
        dqsGrade: r.dqs_grade,
        derivedWsi: r.derived_wsi,
        derivedSfi: r.derived_sfi,
        derivedBws: r.derived_bws,
        totalPowerMw: r.total_power_mw,
        grossFloorAreaSqm: r.gross_floor_area_sqm,
        lat: parseFloat(r.lat),
        lon: parseFloat(r.lon)
      }))
      .filter(dc => dc.name && Number.isFinite(dc.lat) && Number.isFinite(dc.lon));
  }

  // Metrics shown as a vertical list in #controls, in display order.
  const METRIC_FIELDS = [
    { key: 'itLoadMw', label: 'IT load (MW)' },
    { key: 'dqs', label: 'Data quality score' },
    { key: 'dqsGrade', label: 'Data quality score grade' },
    { key: 'derivedWsi', label: 'Water stress index' },
    { key: 'derivedSfi', label: 'Social friction index' },
    { key: 'derivedBws', label: 'Baseline water stress' },
    { key: 'totalPowerMw', label: 'Total power (MW)' },
    { key: 'grossFloorAreaSqm', label: 'Gross floor area (sqm)' }
  ];

  function showDataCenter(target) {
    document.getElementById('dc-name').innerText = target.name;
    document.getElementById('dc-location').innerText = [target.city, target.country].filter(Boolean).join(', ');

    const metricsList = document.getElementById('dc-metrics');
    metricsList.innerHTML = '';
    METRIC_FIELDS.forEach(({ key, label }) => {
      const value = target[key];
      const displayValue = (value === undefined || value === null || value === '') ? 'No data' : value;
      const li = document.createElement('li');
      const labelSpan = document.createElement('span');
      labelSpan.innerText = `${label}:`;
      li.appendChild(labelSpan);
      li.appendChild(document.createTextNode(` ${displayValue}`));
      metricsList.appendChild(li);
    });
  }

  function flyToNext() {
    currentIndex = (currentIndex + 1) % datacenters.length;
    const target = datacenters[currentIndex];

    showDataCenter(target);

    // Smooth client-side flyTo transition
    map.flyTo({
      center: [target.lon, target.lat],
      zoom: 17,
      pitch: 60,
      bearing: 30,
      speed: 0.6,    // Flight speed multiplier
      curve: 1.4,    // Flight arc curvature
      essential: true
    });
  }

  loadDataCenters().then(dcs => {
    datacenters = dcs;
    showDataCenter(datacenters[0]);

    // Initialize MapLibre with Esri Satellite Imagery Tiles
    map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'esri-satellite': {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            attribution: 'Tiles &copy; Esri'
          }
        },
        layers: [
          {
            id: 'esri-satellite-layer',
            type: 'raster',
            source: 'esri-satellite'
          }
        ]
      },
      center: [datacenters[0].lon, datacenters[0].lat],
      zoom: 16,
      pitch: 45
    });

    // Continuously tour every data center: each flyTo pauses for DWELL_MS
    // once it ends ('moveend'), then the next flight is scheduled, looping forever.
    map.on('moveend', () => setTimeout(flyToNext, DWELL_MS));
    map.once('load', () => setTimeout(flyToNext, DWELL_MS));
  });
</script>
</body>
</html>
